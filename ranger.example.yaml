# ranger.example.yaml — annotated copy. Copy to ranger.yaml and set env vars.
---
version: 1

maps:
  - repo: the-metafactory/ranger
    root: 1
    # walk is the walker's autonomy opt-in (node #9):
    #   none           — register only (scout reports; claims nothing)
    #   research-only  — claim auto research frontier nodes (research lane)
    #   full           — also the implement lane (node #23): auto task/build
    #                    nodes, and propose task/build nodes whose ratification
    #                    is the principal's merge of the PR
    walk: none
    # Implement resource lanes (node #57): one visual + one headless worker.
    # Defaults: visual with commands.probe, headless otherwise.
    # lane: headless
    # Optional canonical-checkout override (design §4: probes run where the
    # registry says — the canonical checkout, never a worktree). Defaults to
    # <state.canonicalRoot>/<repo>.
    # canonical: ~/work/ranger-repos/the-metafactory/ranger
    # Implement-lane commands (walk: full). They run in the worktree under the
    # worker's env (no credential) because they execute worker-written code.
    # A walk: full map without commands.test refuses its implement nodes.
    # commands:
    #   install: bun install
    #   test: bun test
    #   # Optional slower tier, run once on the final sage-clean head; a passing
    #   # run is recorded on the PR and gates the merge card. {node} -> node id.
    #   probe: 'npm run probe:pr -- --base origin/main --head HEAD --intent "… node #{node} …"'
    #   probeRetry: PROBE_SELECTION=1 PROBE_FILES={failed} npm run probe   # retry only the failures
    #   probeTimeoutMin: 30
    #   # Informational sheet for ranger:needs-eye, after passing final-head probes.
    #   # before = detached merge-base build; after + after2 = final head + noise control.
    #   # {out} is outside the worktree, under the journal directory, per repo/node/SHA.
    #   # Templates accept only these ranger-owned placeholders; leave them unquoted.
    #   # Captures have a 30-minute timeout each; servers stop by process group.
    #   # commands.install also installs the detached build's dependencies.
    #   views: PROBE_ORIGIN={origin} npm run views -- --label {label} --out {out}
    #   viewsServe: npx vite --port {port} --strictPort
    #   viewsDiff: node scripts/diff-view-set.mjs {out} {a} {b}
    #   # viewsDiff prints one Seelite-style row per PNG:
    #   # hull moved >24/255: 1.23% any change: 4.56%
    #   # Cards attach up to five changed before/after pairs, most-changed first,
    #   # within 10 MiB/file and a 24 MiB total upload budget. Omitted views are named.
    #   # The PR comment records the diff table and local {out}/index.html path.
    #   # Capture/refusal/timeout is reported on the card; it never parks the node.
    # Optional allowlist: walk only these node ids (a first live run).
    # nodes: [550]
    # Optional skip list: never walk these ids (the map is otherwise walked in full).
    # skip: [559]
    # Ranger squash-merges a gate-passed PR itself, except nodes labelled
    # ranger:needs-eye (those keep the one-tap merge card). Default false.
    # autoMerge: true
    # The branch PRs target and atRef probes resolve against (default main).
    # base: main
    # Per-run Discord escalation surface (node #7): one channel per run,
    # decided individually per walk. tokenEnv = env var name holding the bot
    # token (never inline). Reused grove bot + chosen channel (node #11).
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  - repo: jcfischer/seekolous
    root: 26
    walk: none
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1487052222067118111"

  # Two maps may share a repo. Select one with --map owner/name#root.
  # A repo-only selector works only while that repo has exactly one map.
  - repo: jcfischer/seelite
    root: 1
    walk: none
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1487052222067118111"
  - repo: jcfischer/seelite
    root: 460
    walk: none
    # Commands, autoMerge, discord and skip belong to each map independently.
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1487052222067118111"

# The machine account (design §2). `identity` optionally pins the GitHub bot.
# GitLab resolves each host's project bot from its write credential, so this
# GitHub pin can stay in a mixed-forge config. Graph-mutating ticks REFUSE when the
# resolved identity equals the principal's login.
bot:
  identity: ivy-agent

# The principal — the identity autonomous graph-mutation never runs under.
principal:
  login: jcfischer

state:
  # Migration-only: set the original root for ambiguous or deregistered repos.
  # One registered map infers it; otherwise migration refuses until supplied.
  # Historical roots need not remain registered. Remove this after cutover.
  # legacyMapRoots:
  #   jcfischer/seelite: 1
  # SQLite journal (design §8) — workers, events, dead-man/spawn ledger, vetoes.
  journalPath: ~/.config/ranger/state.sqlite
  # Root under which each walked repo's canonical checkout lives.
  canonicalRoot: ~/work/ranger-repos

workers:
  # Daily worker-spawn cap — the global spend bound (design §7).
  spawnCapPerDay: 10
  # Hard wall-clock kill per worker, minutes (design §4 NodeBudget).
  wallClockMin: 90
  # Respawn attempts before a crashed worker is parked + claim released.
  maxAttempts: 2
  # Consecutive worker failures that trip the dead-man switch (claiming stops).
  deadmanThreshold: 3
  # Sage review rounds per implement-lane PR before ranger parks + escalates.
  reviewRounds: 2

auth:
  readOnlyTokens:
    # Longest-prefix match: "the-metafactory/*" covers every metafactory repo,
    # "jcfischer/*" covers personal repos. A more specific prefix wins.
    "the-metafactory/*": RANGER_READONLY_GH_TOKEN_METAFACTORY
    "jcfischer/*": RANGER_READONLY_GH_TOKEN_PERSONAL
  writeTokens:
    # The machine account's WRITE credential (classic repo-scoped PAT, node
    # #11). Same longest-prefix matching. The walker refuses any write tick
    # without one — and never under the principal's credential.
    "the-metafactory/*": RANGER_WRITE_GH_TOKEN_METAFACTORY
    "jcfischer/*": RANGER_WRITE_GH_TOKEN_PERSONAL

# GitHub budget (src/budget.ts, src/frontier-cache.ts). The read-only PATs are
# the principal's, so ranger's reads share the principal's GraphQL allowance.
# All three are optional; these are the defaults.
budget:
  # Defer graph reads while fewer GraphQL points than this remain this hour.
  graphqlFloor: 1000
  # Pause a token's graph reads this long after a secondary (burst) limit.
  rateLimitCooldownMin: 10
  # Re-read a map's frontier at least this often, even when the repo's
  # sentinel (newest issue update + newest issue event) has not moved.
  frontierMaxAgeMin: 60

# Substrate selection (node #45): route implement sessions, fix passes and sage
# reviews across Claude, Codex and Pi by remaining 5h/7d quota. Strong substrates
# (Claude, Codex) are eligible while their reading is fresh, reports at least one
# window, and every window's used% is under its effective threshold. The
# configured threshold applies at window start; it rises linearly to 100% at
# reset, so quota near expiry can be used. Without a reset time it stays fixed. Once
# neither is eligible (over threshold, stale or failed read, no windows, or
# capped), Pi is the fallback: a missing `claude` or `codex` CLI sends every
# session to Pi. Review prefers a substrate other than the one that wrote the PR
# head (best effort: when no other substrate is eligible, the author's own
# substrate or Pi reviews).
substrates:
  # 5-hour window: eligible below this at window start; threshold rises to 100% at reset.
  fiveHourMaxUsedPct: 70
  # 7-day window: eligible below this at window start; threshold rises to 100% at reset.
  sevenDayMaxUsedPct: 80
  # Claude probe reading max age, minutes. A stale reading triggers a haiku probe.
  claudeProbeMaxAgeMin: 15
  # Codex reading max age, minutes. A stale reading triggers an app-server read.
  codexReadMaxAgeMin: 5
  # Codex worker model (node #60): pinned here, so a change to your own
  # ~/.codex/config.toml never changes a ranger build. Passed as
  # `codex exec --model <model> -c model_reasoning_effort="<effort>"`.
  # Defaults apply when the block is left out. Sage's own Codex reviews read
  # sage's config (~/.config/sage/config.json), not this block.
  codex:
    model: gpt-6.1-sol          # a plain model name: [A-Za-z0-9._-]
    reasoningEffort: high       # low | medium | high
  # Pi substrate configuration.
  pi:
    provider: spark
    model: longctx-think

# Provision the two read-only fine-grained PATs (node #8) and store them in the
# macOS keychain (the durable store the ~/bin/ranger wrapper resolves):
#   security add-generic-password -s ranger-ro-metafactory -a token -w <pat>
#   security add-generic-password -s ranger-ro-personal -a token -w <pat>
#     (the-metafactory/* — Issues: Read, Contents: Read)
#     (jcfischer/* — Issues: Read, Contents: Read)
# Create them in GitHub → Settings → Developer settings → Fine-grained PATs.
#
# Provision the Discord token (node #11, reuse grove's bot):
#   export RANGER_DISCORD_TOKEN=<the grove bot token — see grove/bot.env>
# The bot must be a member of the configured channel's guild (Metafactory for
# the ranger map, grove for seekolous).
#
# Provision the machine-account write PATs (node #11, ivy-agent):
# GitHub hard limit (2026-08-16): fine-grained PATs cannot access org repos as
# an outside collaborator (the-metafactory is GitHub Team, 0 free seats — see
# node #16) and can never be scoped to another account's personal repos. So the
# machine-account write credential is a CLASSIC PAT with `repo` scope, stored
# under keychain service `ivy-agent`. The walker refuses any write tick under
# the principal's credential (design §2, node #11).
