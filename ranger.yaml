# ranger.yaml — per-run ranger configuration.
---
# Schema provisional: pending map node #6
# ("Walk-mode opt-in and charting guidance"). Scout reads the maps registry +
# auth; the walker's walk-mode schema is #6's business. Node #11 (provisioning,
# closed) added the per-run Discord escalation surface (node #7 ruling).
# Node #18 (live validation): the ranger map opts in to walk: research-only so
# the machine account can walk the auto research node #19 end-to-end.

version: 1

# Maps ranger walks. Scout reports every registered map's
# frontier/audit/HITL queue.
maps:
  - repo: the-metafactory/ranger
    root: 1
    # walk: full, every eligible node (principal, 2026-10-04: fully
    # autonomous). Skipped: #23 describes the implement lane, which already
    # walks seelite (the principal closes it); #32 waits on cortex#1009,
    # #925 and #929, all open.
    walk: full
    skip: [23, 32]
    # Ranger merges its own gate-passed PRs (principal, 2026-10-03), except
    # nodes labelled ranger:needs-eye.
    autoMerge: true
    commands:
      install: bun install --frozen-lockfile
      test: bun run test && bunx tsc --noEmit
    # The principal's checkout: `ranger serve` (#37) opens grilling
    # sessions here, never in the machine account's canonical clone.
    localCheckout: ~/work/mf/ranger
    # Per-run escalation surface (node #7): one channel per run, decided per
    # walk. The Metafactory guild has no #ranger channel and the reused grove
    # bot lacks MANAGE_CHANNELS there, so the run posts to #soma (one thread
    # per map). Token is the grove bot's — reuse decision, node #11.
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  # GitLab walking (principal, 2026-10-06): the map that teaches ranger to
  # walk claw/crisis-simulator on GÉANT. Same commands and surface as root 1.
  - repo: the-metafactory/ranger
    root: 91
    walk: full
    autoMerge: true
    commands:
      install: bun install --frozen-lockfile
      test: bun run test && bunx tsc --noEmit
    localCheckout: ~/work/mf/ranger
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  # Clawbox remote tests (principal, 2026-10-07): code builds use the
  # headless lane; provisioning and promotion stay explicit map checkpoints.
  - repo: the-metafactory/ranger
    root: 133
    walk: full
    lane: headless
    autoMerge: true
    commands:
      install: bun install --frozen-lockfile
      test: bun run test && bunx tsc --noEmit
    localCheckout: ~/work/mf/ranger
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  - repo: jcfischer/seekolous
    root: 26
    walk: none
    localCheckout: ~/work/cyphr/spark/seekolous
    # Personal map: escalation surface is the principal's private channel on
    # the grove guild (the bot's home server).
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1487052222067118111"

  # Soma (principal, 2026-10-05): all five orienteer maps, walk: full,
  # autoMerge off — ranger runs through soma's own close gate, so every
  # soma PR keeps the one-tap merge card. Walkable after soma #744 (legacy
  # receipts) and #745 (bun test left a pnpm lockfile in the checkout).
  # `bun run test` carries soma's per-test timeout (its package.json); bare
  # `bun test` gives each test 5 s, which soma's install tests overrun under
  # load (2026-10-08, soma #767).
  # Root 604 auto-merges (principal, 2026-10-14): its file-moving refactor PRs
  # went stale behind the merge card while map 781 kept moving main.
  - repo: the-metafactory/soma
    root: 604
    walk: full
    autoMerge: true
    localCheckout: ~/work/mf/soma
    commands:
      install: bun install --frozen-lockfile
      test: bun run test && bun run typecheck
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  - repo: the-metafactory/soma
    root: 645
    walk: full
    autoMerge: false
    localCheckout: ~/work/mf/soma
    commands:
      install: bun install --frozen-lockfile
      test: bun run test && bun run typecheck
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  - repo: the-metafactory/soma
    root: 565
    walk: full
    autoMerge: false
    localCheckout: ~/work/mf/soma
    commands:
      install: bun install --frozen-lockfile
      test: bun run test && bun run typecheck
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  - repo: the-metafactory/soma
    root: 706
    walk: full
    autoMerge: false
    localCheckout: ~/work/mf/soma
    commands:
      install: bun install --frozen-lockfile
      test: bun run test && bun run typecheck
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  - repo: the-metafactory/soma
    root: 533
    walk: full
    autoMerge: false
    localCheckout: ~/work/mf/soma
    commands:
      install: bun install --frozen-lockfile
