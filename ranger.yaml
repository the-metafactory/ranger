# Read-only token gate (node #8 ruling). Only env var NAMES live here — never
# tokens. Prefixes match longest-first against map.repo. Scout refuses to run a
# map without an explicit token; it never falls back to the gh keyring (which is
# write-capable).
auth:
  readOnlyTokens:
    "the-metafactory/*": RANGER_READONLY_GH_TOKEN_METAFACTORY
    "jcfischer/*": RANGER_READONLY_GH_TOKEN_PERSONAL
  # The machine-account WRITE credential (node #11): a single classic
  # `repo`-scoped PAT covers both the org and personal walked repos, so both
  # prefixes map to env names the ~/bin/ranger wrapper exports from the
  # `ivy-agent` keychain service. The walker refuses any write tick without
  # one — and never under the principal's credential (design §2).
  writeTokens:
    "the-metafactory/*": RANGER_WRITE_GH_TOKEN_METAFACTORY
    "jcfischer/*": RANGER_WRITE_GH_TOKEN_PERSONAL

# The machine account (design §2). `identity` is the login ranger labels
# claims/closes with (`soma graph ... --identity <login>`). Graph-mutating ticks
# REFUSE when the resolved identity equals the principal's login.
bot:
  identity: ivy-agent

# Worker budgets. reviewRounds: sage rounds per implement-lane PR before ranger
# parks it for the principal (principal, 2026-10-05: 7, up from 5 on 2026-10-03 and the design §4
# default of 2).
workers:
  reviewRounds: 8
  # New claims per UTC day across all maps (default 10). Raised to 20
  # (principal, 2026-10-04): two lanes and three walked maps used up 10 by midday.
  # Raised to 30 (principal, 2026-10-13).
  spawnCapPerDay: 30
  # Concurrent implement workers per resource lane (default 1 each). Headless
  # raised to 3 (principal, 2026-10-13); visual stays exclusive (screen/GPU).
  laneSlots:
    headless: 3
  # Hard wall clock per worker session, minutes (default 90). Raised to 150
  # (principal, 2026-10-04): seelite #684, a large Traffic build on Codex, was
  # still uncommitted at 80 minutes.
  wallClockMin: 150

# The principal. `discordId` is the escalation desk's 7+ day @-mention target
# (rendered as a real <@id> ping — without it, overdue cards show a no-ping
# hint). Node #20 review round.
principal:
  login: jcfischer
  discordId: "285727653603049472"

# `ranger serve` (#37): the local dashboard, bound on 127.0.0.1.
serve:
  port: 7311
  refreshSec: 900

# Original map before gameplay was registered; used only for journal migration.
state:
  legacyMapRoots:
    jcfischer/seelite: 1

# Run-ledger producer (soma#787 amendment 1, soma#819). Read once ranger#258
# lands; until then the parser ignores it. Creds may publish only on
# local.jc.default.execution.run.finished (user `ranger`, JC_DEFAULT_AGENTS).
bus:
  principal: jc
  stack: default
  url: nats://127.0.0.1:4222
  creds: ~/.config/nats/creds/ranger.creds

# Scheduled jobs (node #301). A Reflex fire enqueues one (`ranger job enqueue
# <name>`, from a cortex process spec); the next tick runs its skill when the
# lane is free and reports one execution.run.finished per run. A job claims no
# node and writes no graph. A session reports its result by writing a `soma:`
# path to $RANGER_JOB_RESULT_FILE; it rides `result_ref` on a succeeded run.
jobs:
  # G6's daily Short (soma#905 D2, D3): daily 06:00 Europe/Zurich. The skill is
  # Claude-only; capture is GPU work, so the visual lane keeps it off seelite.
  # Publish alone can wait 40 min for YouTube's checks.
  - name: daily-short
    skill: daily-short
    lane: visual
    wallClockMin: 90
    cwd: ~/work/far-between/shorts
    substrates: [claude]
