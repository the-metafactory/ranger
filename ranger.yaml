# ranger.yaml — per-run ranger configuration.
---
# Schema provisional: pending map node #6
# ("Walk-mode opt-in and charting guidance"). Scout reads the maps registry +
# auth; the walker's walk-mode schema is #6's business. Node #11 (provisioning,
# closed) added the per-run Discord escalation surface (node #7 ruling).
# Node #18 (live validation): the ranger map opts in to walk: research-only so
# the machine account can walk the auto research node #19 end-to-end.

version: 1

# Maps ranger walks. Scout reports every registered map's
# frontier/audit/HITL queue.
maps:
  - repo: the-metafactory/ranger
    root: 1
    walk: research-only
    # Per-run escalation surface (node #7): one channel per run, decided per
    # walk. The Metafactory guild has no #ranger channel and the reused grove
    # bot lacks MANAGE_CHANNELS there, so the run posts to #soma (one thread
    # per map). Token is the grove bot's — reuse decision, node #11.
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  - repo: jcfischer/seekolous
    root: 26
    walk: none
    # Personal map: escalation surface is the principal's private channel on
    # the grove guild (the bot's home server).
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1487052222067118111"

  - repo: jcfischer/seelite
    root: 1
    walk: full
    # Shares seekolous's private grove channel rather than opening a second
    # personal surface. Implement-lane acceptance (node #23): walk: full since
    # 2026-10-03, ivy-agent has write access. The allowlist keeps the live run
    # to #550 (headless test, artifact-exists probe); #559 needs the
    # principal's ear and a squash-safe probe first.
    nodes: [550, 669]
    commands:
      install: npm ci --no-audit --no-fund
      test: npm test
      # The browser tier (principal, 2026-10-03): the TypeSafe-selected probes
      # for the branch diff, once on the final sage-clean head; a passing run
      # gates the merge card. The selector reads TYPESAFE_API_KEY from ~/.env
      # itself. The intent is ranger-authored: only the node id is templated
      # (seelite CLAUDE.md: never paste tracker or PR text into --intent).
      # GPU lane: headed Chromium opens on the host screen while it runs.
      probe: 'npm run probe:pr -- --base origin/main --head HEAD --intent "Ranger implement lane: the diff on this branch implements orienteer node #{node}; select every browser probe the changed files can affect."'
      probeTimeoutMin: 30
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1487052222067118111"

# Read-only token gate (node #8 ruling). Only env var NAMES live here — never
# tokens. Prefixes match longest-first against map.repo. Scout refuses to run a
# map without an explicit token; it never falls back to the gh keyring (which is
# write-capable).
auth:
  readOnlyTokens:
    "the-metafactory/*": RANGER_READONLY_GH_TOKEN_METAFACTORY
    "jcfischer/*": RANGER_READONLY_GH_TOKEN_PERSONAL
  # The machine-account WRITE credential (node #11): a single classic
  # `repo`-scoped PAT covers both the org and personal walked repos, so both
  # prefixes map to env names the ~/bin/ranger wrapper exports from the
  # `ivy-agent` keychain service. The walker refuses any write tick without
  # one — and never under the principal's credential (design §2).
  writeTokens:
    "the-metafactory/*": RANGER_WRITE_GH_TOKEN_METAFACTORY
    "jcfischer/*": RANGER_WRITE_GH_TOKEN_PERSONAL

# The machine account (design §2). `identity` is the login ranger labels
# claims/closes with (`soma graph ... --identity <login>`). Graph-mutating ticks
# REFUSE when the resolved identity equals the principal's login.
bot:
  identity: ivy-agent

# The principal. `discordId` is the escalation desk's 7+ day @-mention target
# (rendered as a real <@id> ping — without it, overdue cards show a no-ping
# hint). Node #20 review round.
principal:
  login: jcfischer
  discordId: "285727653603049472"
