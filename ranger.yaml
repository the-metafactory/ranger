# ranger.yaml — per-run ranger configuration.
---
# Schema provisional: pending map node #6
# ("Walk-mode opt-in and charting guidance"). Scout reads the maps registry +
# auth; the walker's walk-mode schema is #6's business. Node #11 (provisioning,
# closed) added the per-run Discord escalation surface (node #7 ruling).
# Node #18 (live validation): the ranger map opts in to walk: research-only so
# the machine account can walk the auto research node #19 end-to-end.

version: 1

# Maps ranger walks. Scout reports every registered map's
# frontier/audit/HITL queue.
maps:
  - repo: the-metafactory/ranger
    root: 1
    # walk: full, every eligible node (principal, 2026-10-04: fully
    # autonomous). Skipped: #23 describes the implement lane, which already
    # walks seelite (the principal closes it); #32 waits on cortex#1009,
    # #925 and #929, all open.
    walk: full
    skip: [23, 32]
    # Ranger merges its own gate-passed PRs (principal, 2026-10-03), except
    # nodes labelled ranger:needs-eye.
    autoMerge: true
    commands:
      install: bun install --frozen-lockfile
      test: bun run test && bunx tsc --noEmit
    # The principal's checkout: `ranger serve` (#37) opens grilling
    # sessions here, never in the machine account's canonical clone.
    localCheckout: ~/work/mf/ranger
    # Per-run escalation surface (node #7): one channel per run, decided per
    # walk. The Metafactory guild has no #ranger channel and the reused grove
    # bot lacks MANAGE_CHANNELS there, so the run posts to #soma (one thread
    # per map). Token is the grove bot's — reuse decision, node #11.
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  # GitLab walking (principal, 2026-10-06): the map that teaches ranger to
  # walk claw/crisis-simulator on GÉANT. Same commands and surface as root 1.
  - repo: the-metafactory/ranger
    root: 91
    walk: full
    autoMerge: true
    commands:
      install: bun install --frozen-lockfile
      test: bun run test && bunx tsc --noEmit
    localCheckout: ~/work/mf/ranger
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  # Clawbox remote tests (principal, 2026-10-07): code builds use the
  # headless lane; provisioning and promotion stay explicit map checkpoints.
  - repo: the-metafactory/ranger
    root: 133
    walk: full
    lane: headless
    autoMerge: true
    commands:
      install: bun install --frozen-lockfile
      test: bun run test && bunx tsc --noEmit
    localCheckout: ~/work/mf/ranger
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  - repo: jcfischer/seekolous
    root: 26
    walk: none
    localCheckout: ~/work/cyphr/spark/seekolous
    # Personal map: escalation surface is the principal's private channel on
    # the grove guild (the bot's home server).
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1487052222067118111"

  - repo: jcfischer/seelite
    root: 1
    walk: full
    localCheckout: ~/work/cyphr/spark/seelite
    # Shares seekolous's private grove channel rather than opening a second
    # personal surface. walk: full since 2026-10-03 (ivy-agent has write
    # access). Every eligible task is walked (principal, 2026-10-03: grillings
    # are the principal's, ranger builds what they spawn) except the skip
    # list: #559 needs the principal's ear and a squash-safe probe first.
    skip: [559]
    # Ranger merges a gate-passed PR itself (principal, 2026-10-03), except
    # nodes labelled ranger:needs-eye, which keep the one-tap merge card.
    autoMerge: true
    commands:
      install: npm ci --no-audit --no-fund
      test: npm test
      # The browser tier (principal, 2026-10-03): the TypeSafe-selected probes
      # for the branch diff, once on the final sage-clean head; a passing run
      # gates the merge card. The selector reads TYPESAFE_API_KEY from ~/.env
      # itself. The intent is ranger-authored: only the node id is templated
      # (seelite CLAUDE.md: never paste tracker or PR text into --intent).
      # GPU lane: headed Chromium opens on the host screen while it runs.
      probe: 'npm run probe:pr -- --base origin/main --head HEAD --intent "Ranger implement lane: the diff on this branch implements orienteer node #{node}; select every browser probe the changed files can affect."'
      # A failed run retries only the probes it named (2026-10-04: one
      # load-induced crash cost a 25-minute full rerun). The runner takes an
      # exact list through PROBE_SELECTION/PROBE_FILES.
      probeRetry: PROBE_SELECTION=1 PROBE_FILES={failed} npm run probe
      probeTimeoutMin: 30
      views: PROBE_ORIGIN={origin} npm run views -- --label {label} --out {out}
      viewsServe: npx vite --port {port} --strictPort
      viewsDiff: node scripts/diff-view-set.mjs {out} {a} {b}
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1487052222067118111"

  # Node #38: register gameplay with walk: full and the same commands and
  # autoMerge as platform. Node #47 omits platform's map-specific skip list.
  - repo: jcfischer/seelite
    root: 460
    walk: full
    localCheckout: ~/work/cyphr/spark/seelite
    autoMerge: true
    commands:
      install: npm ci --no-audit --no-fund
      test: npm test
      probe: 'npm run probe:pr -- --base origin/main --head HEAD --intent "Ranger implement lane: the diff on this branch implements orienteer node #{node}; select every browser probe the changed files can affect."'
      probeRetry: PROBE_SELECTION=1 PROBE_FILES={failed} npm run probe
      probeTimeoutMin: 30
      views: PROBE_ORIGIN={origin} npm run views -- --label {label} --out {out}
      viewsServe: npx vite --port {port} --strictPort
      viewsDiff: node scripts/diff-view-set.mjs {out} {a} {b}
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1487052222067118111"

  # Soma (principal, 2026-10-05): all five orienteer maps, walk: full,
  # autoMerge off — ranger runs through soma's own close gate, so every
  # soma PR keeps the one-tap merge card. Walkable after soma #744 (legacy
  # receipts) and #745 (bun test left a pnpm lockfile in the checkout).
  - repo: the-metafactory/soma
    root: 604
    walk: full
    autoMerge: false
    localCheckout: ~/work/mf/soma
    commands:
      install: bun install --frozen-lockfile
      test: bun test && bun run typecheck
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  - repo: the-metafactory/soma
    root: 645
    walk: full
    autoMerge: false
    localCheckout: ~/work/mf/soma
    commands:
      install: bun install --frozen-lockfile
      test: bun test && bun run typecheck
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  - repo: the-metafactory/soma
    root: 565
    walk: full
    autoMerge: false
    localCheckout: ~/work/mf/soma
    commands:
      install: bun install --frozen-lockfile
      test: bun test && bun run typecheck
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  - repo: the-metafactory/soma
    root: 706
    walk: full
    autoMerge: false
    localCheckout: ~/work/mf/soma
    commands:
      install: bun install --frozen-lockfile
      test: bun test && bun run typecheck
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  - repo: the-metafactory/soma
    root: 533
    walk: full
    autoMerge: false
    localCheckout: ~/work/mf/soma
    commands:
      install: bun install --frozen-lockfile
      test: bun test && bun run typecheck
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  # Build-brief rules by construction (principal, 2026-10-06): moved soma#742
  # onto a map; the build node waits on the kind-interpretation grilling.
  - repo: the-metafactory/soma
    root: 751
    walk: full
    autoMerge: false
    localCheckout: ~/work/mf/soma
    commands:
      install: bun install --frozen-lockfile
      test: bun test && bun run typecheck
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"
  # Work-graph rules live in WorkGraph, not the CLI (principal, 2026-10-07):
  # moved soma#758 onto a map as two build nodes (#767, then #768).
  - repo: the-metafactory/soma
    root: 766
    walk: full
    autoMerge: true
    localCheckout: ~/work/mf/soma
    commands:
      install: bun install --frozen-lockfile
      test: bun test && bun run typecheck
    discord:
      tokenEnv: RANGER_DISCORD_TOKEN
      channelId: "1505550997764833444"

# Read-only token gate (node #8 ruling). Only env var NAMES live here — never
# tokens. Prefixes match longest-first against map.repo. Scout refuses to run a
# map without an explicit token; it never falls back to the gh keyring (which is
# write-capable).
auth:
  readOnlyTokens:
    "the-metafactory/*": RANGER_READONLY_GH_TOKEN_METAFACTORY
    "jcfischer/*": RANGER_READONLY_GH_TOKEN_PERSONAL
  # The machine-account WRITE credential (node #11): a single classic
  # `repo`-scoped PAT covers both the org and personal walked repos, so both
  # prefixes map to env names the ~/bin/ranger wrapper exports from the
  # `ivy-agent` keychain service. The walker refuses any write tick without
  # one — and never under the principal's credential (design §2).
  writeTokens:
    "the-metafactory/*": RANGER_WRITE_GH_TOKEN_METAFACTORY
    "jcfischer/*": RANGER_WRITE_GH_TOKEN_PERSONAL

# The machine account (design §2). `identity` is the login ranger labels
# claims/closes with (`soma graph ... --identity <login>`). Graph-mutating ticks
# REFUSE when the resolved identity equals the principal's login.
bot:
  identity: ivy-agent

# Worker budgets. reviewRounds: sage rounds per implement-lane PR before ranger
# parks it for the principal (principal, 2026-10-05: 7, up from 5 on 2026-10-03 and the design §4
# default of 2).
workers:
  reviewRounds: 7
  # New claims per UTC day across all maps (default 10). Raised to 20
  # (principal, 2026-10-04): two lanes and three walked maps used up 10 by midday.
  spawnCapPerDay: 20
  # Hard wall clock per worker session, minutes (default 90). Raised to 150
  # (principal, 2026-10-04): seelite #684, a large Traffic build on Codex, was
  # still uncommitted at 80 minutes.
  wallClockMin: 150

# The principal. `discordId` is the escalation desk's 7+ day @-mention target
# (rendered as a real <@id> ping — without it, overdue cards show a no-ping
# hint). Node #20 review round.
principal:
  login: jcfischer
  discordId: "285727653603049472"

# `ranger serve` (#37): the local dashboard, bound on 127.0.0.1.
serve:
  port: 7311
  refreshSec: 900

# Original map before gameplay was registered; used only for journal migration.
state:
  legacyMapRoots:
    jcfischer/seelite: 1
